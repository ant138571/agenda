<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarefas da equipe</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png?v=7">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --soft:#F6F5F2; --ink:#1C1B1A; --muted:#6B665F; --faint:#A19D96;
  --line:#ECE9E4; --line-strong:#DAD5CD; --accent:#F0643C; --accent-ink:#FFFFFF; --accent-soft:#FFEDE6; --accent-text:#B83E1C;
  --imp:#F5A524; --p1:#F0643C; --p2:#CFCAC2; --p3:#9BC7AA;
  --danger:#D93A2B; --ok:#2F9E5F; --shadow:0 1px 2px rgba(30,25,20,.06),0 8px 24px rgba(30,25,20,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161514; --panel:#1F1D1B; --soft:#262422; --ink:#F2EFEA; --muted:#B0AAA1; --faint:#7D776F;
    --line:#2E2B28; --line-strong:#3D3935; --accent:#FF7A52; --accent-ink:#1C1B1A; --accent-soft:#3A241C; --accent-text:#FF9A78;
    --imp:#F5B544; --p1:#FF7A52; --p2:#5A5550; --p3:#6FA886;
    --danger:#FF6B5E; --ok:#5CC98A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161514; --panel:#1F1D1B; --soft:#262422; --ink:#F2EFEA; --muted:#B0AAA1; --faint:#7D776F;
  --line:#2E2B28; --line-strong:#3D3935; --accent:#FF7A52; --accent-ink:#1C1B1A; --accent-soft:#3A241C; --accent-text:#FF9A78;
  --imp:#F5B544; --p1:#FF7A52; --p2:#5A5550; --p3:#6FA886;
  --danger:#FF6B5E; --ok:#5CC98A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;flex:none}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
.top .who{font-size:13px;color:var(--muted)}
.top .sp{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.auth{max-width:400px;margin:8vh auto 0}
.auth h1{font-size:22px;margin:0 0 4px}
.auth p{color:var(--muted);margin:0 0 16px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],textarea{border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--panel);width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:0;border-color:var(--accent)}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.link{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600}
.msg{font-size:13.5px;margin:10px 0 0;color:var(--muted)}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:2px;gap:2px;margin-bottom:6px}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted);border-radius:8px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.proj{margin-top:20px}
.proj h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:800}
.task{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:8px;overflow:hidden}
.task.open{border-color:var(--line-strong);box-shadow:var(--shadow)}
.t-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;cursor:pointer}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:none;flex:none;display:grid;place-items:center;padding:0;margin-top:1px;color:transparent}
.chk:hover{border-color:var(--accent);color:var(--accent)}
.task.done .chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.t-main{flex:1;min-width:0}
.t-title{font-weight:600}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:2px}
/* indicadores das tarefas: mesmo desenho do app (prazo, P1/P3, baixa importância, estrela de importância alta) */
.m-late{color:var(--danger);font-weight:700}
.m-due{color:var(--muted);font-weight:600}
.m-due.today{color:var(--accent-text)}
.m-p1{background:var(--p1);color:#fff;font-weight:800;padding:0 6px;border-radius:6px;line-height:17px}
.m-p3{color:var(--faint);font-weight:700}
.m-low{color:var(--faint)}
.star-ic{color:var(--imp);flex:none;display:inline-grid;padding:0 4px;align-self:center}
.chk.p1{border-color:var(--p1)}
/* ordenar (mesmo controle do app) */
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;margin:4px 0 2px}
.flabel{color:var(--muted);margin-right:6px}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.t-body{border-top:1px solid var(--line);padding:14px 14px 16px;display:flex;flex-direction:column;gap:2px}
.row2{display:grid;grid-template-columns:1fr 170px;gap:10px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }
.steps{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.step{display:flex;align-items:center;gap:8px}
.step input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.step input[type=text]{padding:6px 9px}
.step.feita input[type=text]{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:4px 6px}
.x:hover{color:var(--danger)}
.coms{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.com{background:var(--soft);border-radius:10px;padding:8px 10px}
.com-h{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.com-h b{color:var(--ink);font-size:13px}
.com-t{white-space:pre-wrap;word-wrap:break-word;font-size:14px;margin-top:2px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1.5px dashed var(--line);border-radius:14px;font-size:14px;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:10;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.sep{height:1px;background:var(--line);margin:10px 0}
.sec-t{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.sec-t small{font-weight:600;text-transform:none;letter-spacing:0}
/* Cronograma: o mesmo desenho do cartão do app (aba Cronograma do projeto; bloco cronoCss do index.html) */
.crono{
  --fundo:#f4f5f7; --texto:#16181d; --suave:#565c67; --linha:#c9cdd5; --erro:#b3261e;
  --azul:#2f6fdb; --cinza:#8b9099; --verde:#2a9d5c; --rosa:#e0709a; --amarelo:#e3b400;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --corpo:"Source Serif 4",Georgia,"Times New Roman",serif;
  container-type:inline-size;
  background:var(--fundo); color:var(--texto); font-family:var(--corpo); font-size:1.0625rem; line-height:1.6;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .crono{ --fundo:#14161a; --texto:#eceef2; --suave:#a0a7b2; --linha:#333842; --erro:#ff8a80; --azul:#5b95ff; --cinza:#8b9099; --verde:#43c17c; --rosa:#f08db2; --amarelo:#f0c928; } }
:root[data-theme="dark"] .crono{ --fundo:#14161a; --texto:#eceef2; --suave:#a0a7b2; --linha:#333842; --erro:#ff8a80; --azul:#5b95ff; --cinza:#8b9099; --verde:#43c17c; --rosa:#f08db2; --amarelo:#f0c928; }
.crono *,.crono *::before,.crono *::after{box-sizing:border-box}
.crono.cr-card{border-radius:16px;padding:2rem 2.25rem 1.5rem}
.crono .cr-titulo{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,5.2vw,3.1rem);line-height:1.06;letter-spacing:-.02em;text-wrap:balance}
.crono.cr-card .cr-titulo{font-size:clamp(1.7rem,4vw,2.6rem)}
.crono .periodo{margin:1.1rem 0 0;color:var(--suave);font-size:1.05rem}
.crono .faixa{margin:3rem 0 3.5rem}
.crono .escala{position:relative;height:8rem;margin:0 12px}
.crono .barra{position:absolute;left:0;right:0;top:3.75rem;height:10px;border-radius:5px;background:var(--cinza)}
.crono .ticks{position:absolute;left:0;right:0;top:calc(3.75rem + 16px);height:6px;border-right:1px solid var(--linha);background-image:linear-gradient(to right,var(--linha) 1px,transparent 1px)}
.crono .marca{position:absolute;top:0;left:var(--x);height:100%}
.crono .ponto{position:absolute;left:0;top:calc(3.75rem - 4px);width:18px;height:18px;border-radius:50%;transform:translateX(-50%);background:var(--c);box-shadow:0 0 0 3px var(--fundo)}
.crono .marca.vazia .ponto{background:var(--fundo);border:2px solid var(--c)}
.crono .rotulo{position:absolute;white-space:nowrap;text-align:center;transform:translateX(-50%);line-height:1.25}
.crono .rotulo b{display:block;font-family:var(--display);font-weight:700;font-size:.95rem}
.crono .rotulo small{display:block;font-size:.85rem;color:var(--suave)}
.crono .rotulo.sem-legenda small{display:none}
.crono .rotulo.oculto{visibility:hidden}
.crono .acima .rotulo{bottom:4.85rem}
.crono .abaixo .rotulo{top:5.15rem}
.crono .ini .rotulo{transform:none;text-align:left;left:-12px}
.crono .fim .rotulo{transform:none;text-align:right;right:-12px;left:auto}
.crono .hoje{position:absolute;top:.9rem;bottom:.5rem;width:1px;background:var(--texto);opacity:.55}
.crono .hoje span{position:absolute;top:-1.1rem;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:.8rem}
.crono .linha{list-style:none;margin:0;padding:0}
.crono .evento{display:grid;grid-template-columns:9.5rem 2.25rem minmax(0,1fr)}
.crono .data{grid-column:1;padding-bottom:2.75rem}
.crono .trilho{grid-column:2;position:relative}
.crono .corpo{grid-column:3;padding-bottom:2.75rem}
.crono .trilho::before{content:"";position:absolute;left:50%;top:1.1rem;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(var(--c),var(--cn,var(--c)))}
.crono .evento:last-child .trilho::before{display:none}
.crono .trilho::after{content:"";position:absolute;left:50%;top:calc(1.1rem - 8px);width:16px;height:16px;border-radius:50%;transform:translateX(-50%);background:var(--c);box-shadow:0 0 0 4px var(--fundo)}
.crono .evento[data-sem] .trilho::after{background:var(--fundo);border:2px solid var(--c)}
.crono .dia{display:block;font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;letter-spacing:-.01em}
.crono .sem,.crono .hora{display:block}
.crono .sem{color:var(--suave)}
.crono .hora{font-weight:600}
.crono .proximo{display:inline-block;margin-top:.6rem;padding:.1rem .65rem;border:1.5px solid var(--c);border-radius:999px;font-family:var(--display);font-size:.82rem;line-height:1.5}
.crono .corpo>:first-child{margin-top:.3rem}
.crono .contexto{margin:0 0 .9rem;color:var(--suave);font-style:italic}
.crono .evento[data-sem] .contexto{margin:.3rem 0 0}
.crono .evento[data-sem] .contexto+.contexto{margin-top:.4rem}
.crono .corpo ul{list-style:none;margin:0;padding:0;max-width:38rem}
.crono .corpo li{position:relative;padding-left:1.5rem;margin:0 0 .85rem}
.crono .corpo li .info{display:block;color:var(--suave);font-size:.88em;line-height:1.4}
.crono .corpo li::before{content:"";position:absolute;left:0;top:.82em;width:.75rem;height:2px;background:var(--c)}
.crono .passou .data,.crono .passou .corpo{opacity:.6}
.crono .cr-vazio{margin:1.5rem 0 1rem;color:var(--suave);font-style:italic}
.crono header.cr-com-logo{position:relative;padding-right:min(34%,13rem);min-height:4.5rem}
.crono .cr-logo{position:absolute;top:0;right:0;max-width:min(32%,12rem);max-height:5.5rem;object-fit:contain}
.crono .cr-depto{margin:0 0 .5rem;font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.crono .cr-equipe{margin-top:.5rem;padding-top:1.4rem;border-top:1px solid var(--linha);break-inside:avoid}
.crono .cr-eq-titulo{margin:0 0 .8rem;font-family:var(--display);font-weight:700;font-size:1.35rem}
.crono .cr-equipe ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem 1.5rem}
.crono .cr-equipe li{line-height:1.35}
.crono .cr-equipe b{display:block;font-family:var(--display);font-weight:700}
.crono .cr-eq-func,.crono .cr-eq-mail{display:block;color:var(--suave);font-size:.9em}
.crono .cr-eq-grupo{margin-bottom:1rem;break-inside:avoid}
.crono .cr-eq-grupo h4{margin:0 0 .45rem;font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.crono .cr-eq-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.crono .cr-eq-cols.um{grid-template-columns:minmax(0,1fr)}
.crono .cr-eq-col{min-width:0;padding-right:1.5rem}
.crono .cr-eq-col+.cr-eq-col{padding:0 0 0 1.5rem;border-left:1px solid var(--linha)}
.crono .cr-eq-cols ul{grid-template-columns:minmax(0,1fr)}
.crono .cr-eq-cols li,.crono .cr-eq-cols h4{overflow-wrap:anywhere}
@container (max-width:40rem){
  .crono .rotulo small{display:none}
  .crono .evento{grid-template-columns:1.75rem minmax(0,1fr)}
  .crono .trilho{grid-column:1;grid-row:1/span 2}
  .crono .data{grid-column:2;grid-row:1;padding-bottom:.7rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .8rem}
  .crono .corpo{grid-column:2;grid-row:2}
  .crono .proximo{margin-top:0}
  .crono .escala{height:7rem}
  .crono .barra{top:3.25rem}
  .crono .ticks{top:calc(3.25rem + 16px)}
  .crono .ponto{top:calc(3.25rem - 4px)}
  .crono .acima .rotulo{bottom:4.35rem}
  .crono .abaixo .rotulo{top:4.65rem}
}
@media (max-width:860px){ .crono.cr-card{padding:1.4rem 1.1rem 1rem} }
.nova{display:grid;grid-template-columns:1fr 150px auto;gap:8px}
@media (max-width:520px){ .nova{grid-template-columns:1fr auto} .nova input[type=text]{grid-column:1/-1} }
.pt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:6px}
.pt .t-main{cursor:default}
.mine{font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
/* Página da equipe: cada membro entra com a própria conta (mesmo e-mail cadastrado na aba Equipe do projeto) e vê
   só as tarefas atribuídas a ele. Tudo passa pela função "equipe" do servidor (guia EQUIPE.html). */
const $=(s,el=document)=>el.querySelector(s);
const h=(tag,attrs={},...kids)=>{ const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(v==null||v===false) continue; if(k==="class") el.className=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?"":v); }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); } return el; };
const CHECK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const ic=html=>{ const s=h("span",{style:"display:inline-grid"}); s.innerHTML=html; return s; };
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
const fmtDue=s=>{ const [y,m,d]=s.split("-").map(Number), x=new Date(y,m-1,d); return `${DIAS[x.getDay()]} ${pad(d)}/${pad(m)}`; };
const fmtQuando=iso=>{ const d=new Date(iso); return isNaN(d)?"":`${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
/* prazo, importância e prioridade: mesmos textos, desenho e ordem do app (taskRow, PRI, sortTasks) */
const PRI={1:"P1 · Urgente",2:"P2 · Normal",3:"P3 · Pode esperar"};
const STAR='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>';
const prazoTag=(t,td)=>t.due<td?h("span",{class:"m-late",title:"Prazo"},"atrasada · "+fmtDue(t.due).slice(-5)):h("span",{class:"m-due"+(t.due===td?" today":""),title:"Prazo"},t.due===td?"hoje":fmtDue(t.due));
const classTags=t=>t.done?[]:[t.priority===1?h("span",{class:"m-p1",title:PRI[1]},"P1"):null,t.priority===3?h("span",{class:"m-p3",title:PRI[3]},"P3"):null,t.importance===1?h("span",{class:"m-low"},"baixa imp."):null].filter(Boolean);
const estrela=t=>t.importance===3&&!t.done?h("span",{class:"star-ic",title:"Importância alta"},ic(STAR)):null;
const ORDENS=[["due","Prazo"],["importance","Importância"],["priority","Prioridade"]];
function ordenar(l,by){
  const key={due:t=>(t.due||"9999")+(t.priority||2)+(4-(t.importance||2)),
    priority:t=>`${t.priority||2}${4-(t.importance||2)}${t.due||"9999"}`,

        var box=r.getBoundingClientRect();
        if(!m.classList.contains("ini")&&!m.classList.contains("fim")){
          if(box.left<limite.left-12){ r.style.transform="none"; r.style.left="-12px"; r.style.textAlign="left"; box=r.getBoundingClientRect(); }
          else if(box.right>limite.right+12){ r.style.transform="translateX(-100%)"; r.style.left="12px"; r.style.textAlign="right"; box=r.getBoundingClientRect(); }
        }
        if(box.left<ultimo+8){ r.classList.add("sem-legenda"); box=r.getBoundingClientRect(); }
        if(box.left<ultimo+8){ r.classList.add("oculto"); return; }
        ultimo=box.right;
      });
    });
  });
}
function crAjustarTudo(){ requestAnimationFrame(()=>crAjustar(document)); }
window.addEventListener("resize",()=>{ clearTimeout(crAjustarTudo.t); crAjustarTudo.t=setTimeout(crAjustarTudo,80); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(crAjustarTudo);
const chave=t=>t.dono+"/"+t.id;
async function salvar(t,mudancas,msgOk){
  try{ const j=await chamar({acao:"alterar",dono:t.dono,tarefa:t.id,mudancas}); const n=j.tarefa;
    Object.assign(t,{title:n.title,due:n.due,done:n.done,doneAt:n.doneAt,notes:n.notes,steps:n.steps,repete:n.repete}); toast(msgOk); render(); return true; }
  catch(e){ toast("Não foi salvo: "+e.message); return false; }
}
function cartao(t){
  const td=today(), aberta=ST.aberta===chave(t);
  const meta=[];
  if(t.done&&t.doneAt) meta.push(h("span",{},"concluída em "+fmtQuando(t.doneAt).slice(0,5)));
  if(t.done&&t.due) meta.push(h("span",{class:"m-due",title:"Prazo"},"prazo "+fmtDue(t.due)));
  else if(t.due) meta.push(prazoTag(t,td));
  if(t.repete) meta.push(h("span",{},"repete: "+t.repete));
  meta.push(...classTags(t));
  if(t.steps.length) meta.push(h("span",{},`etapas ${t.steps.filter(s=>s.done).length}/${t.steps.length}`));
  if(t.responsaveis.length>1) meta.push(h("span",{},"com "+t.responsaveis.filter(n=>n!==ST.nome).join(", ")));
  if(t.comentarios.length) meta.push(h("span",{},`${t.comentarios.length} comentário${t.comentarios.length===1?"":"s"}`));
  const chk=h("button",{class:"chk"+(t.priority===1&&!t.done?" p1":""),title:t.done?"Marcar como pendente":"Concluir","aria-label":t.done?"Marcar como pendente":"Concluir",onclick:e=>{ e.stopPropagation(); chk.disabled=true;
    salvar(t,{done:!t.done},t.done?"Tarefa reaberta":t.repete?"Concluída nesta data":"Tarefa concluída").finally(()=>{ chk.disabled=false; }); }},ic(CHECK));
  const box=h("div",{class:"task"+(t.done?" done":"")+(aberta?" open":"")},
    h("div",{class:"t-row",onclick:()=>{ ST.aberta=aberta?null:chave(t); render(); }},chk,
      h("div",{class:"t-main"},h("div",{class:"t-title"},t.title),meta.length?h("div",{class:"t-meta"},meta):null),estrela(t)));
  if(aberta) box.append(detalhe(t));
  return box;
}
function detalhe(t){
  const titulo=h("input",{type:"text",id:"eTit",maxlength:"500"}); titulo.value=t.title;
  const prazo=h("input",{type:"date",id:"ePrazo",max:"2099-12-31"}); prazo.value=t.due||""; if(!t.due||t.due>=today()) prazo.min=today();
  const notas=h("textarea",{id:"eNotas",placeholder:"Anotações, links…"}); notas.value=t.notes;
  // etapas (rascunho local até salvar)
  const etapas=t.steps.map(s=>({...s}));
  const stepsBox=h("div",{class:"steps"});
  const nova=h("input",{type:"text",placeholder:"Adicionar etapa (Enter)",maxlength:"500"});
  const pintar=()=>{ stepsBox.replaceChildren(...etapas.map((s,i)=>{
    const cb=h("input",{type:"checkbox","aria-label":"Etapa feita"}); cb.checked=s.done; cb.addEventListener("change",()=>{ s.done=cb.checked; pintar(); });
    const tx=h("input",{type:"text",maxlength:"500","aria-label":"Etapa"}); tx.value=s.title; tx.addEventListener("input",()=>{ s.title=tx.value; });
    return h("div",{class:"step"+(s.done?" feita":"")},cb,tx,h("button",{class:"x",type:"button",title:"Remover etapa","aria-label":"Remover etapa",onclick:()=>{ etapas.splice(i,1); pintar(); }},"×")); })); };
  const addEtapa=()=>{ const v=nova.value.trim(); if(!v) return; etapas.push({id:"s"+Date.now().toString(36),title:v,done:false}); nova.value=""; pintar(); nova.focus(); };
  nova.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addEtapa(); } });
  pintar();
  const gravar=h("button",{class:"btn primary",onclick:async()=>{
    if(nova.value.trim()) addEtapa();
    const m={}, tit=titulo.value.replace(/\s+/g," ").trim();
    if(!tit){ toast("O nome da tarefa não pode ficar vazio."); titulo.focus(); return; }
    if(tit!==t.title) m.title=tit;
    if((prazo.value||null)!==(t.due||null)){ if(prazo.value&&prazo.value<today()){ toast("Escolha um prazo de hoje em diante."); return; } m.due=prazo.value||null; }
    if(notas.value!==t.notes) m.notes=notas.value;
    const limpas=etapas.filter(s=>s.title.trim()).map(s=>({id:s.id,title:s.title.trim(),done:!!s.done}));
    if(JSON.stringify(limpas)!==JSON.stringify(t.steps.map(s=>({id:s.id,title:s.title,done:!!s.done})))) m.steps=limpas;
    if(!Object.keys(m).length){ toast("Nada a salvar."); return; }
    if("due" in m&&m.due===null&&t.repete&&!confirm("Sem prazo, a tarefa deixa de se repetir. Continuar?")) return;
    gravar.disabled=true; await salvar(t,m,"Alterações salvas"); gravar.disabled=false; }},"Salvar alterações");
  // comentários
  const coms=h("div",{class:"coms"},t.comentarios.length?t.comentarios.map(c=>h("div",{class:"com"},h("div",{class:"com-h"},h("b",{},c.autor||c.email),h("span",{},fmtQuando(c.criado_em))),h("div",{class:"com-t"},c.texto))):h("div",{class:"hint"},"Nenhum comentário ainda."));
  const com=h("textarea",{id:"eCom",placeholder:"Escreva um comentário para o coordenador e a equipe…",maxlength:"2000",style:"min-height:64px"});
  const enviar=h("button",{class:"btn",onclick:async()=>{ const tx=com.value.trim(); if(!tx){ com.focus(); return; } enviar.disabled=true;
    try{ const j=await chamar({acao:"comentar",dono:t.dono,tarefa:t.id,texto:tx}); if(j.comentario) t.comentarios.push(j.comentario); toast("Comentário enviado"); render(); }
    catch(e){ toast("Comentário não enviado: "+e.message); enviar.disabled=false; } }},"Comentar");
  com.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); enviar.click(); } });
  return h("div",{class:"t-body"},
    h("div",{class:"row2"},h("div",{class:"field"},h("label",{for:"eTit"},"Nome da tarefa"),titulo),h("div",{class:"field"},h("label",{for:"ePrazo"},"Prazo"),prazo)),
    h("div",{class:"field"},h("span",{class:"lbl"},"Etapas"),stepsBox,nova),
    h("div",{class:"field"},h("label",{for:"eNotas"},"Anotações"),notas),
    h("div",{class:"hint"},"Projeto "+t.projetoTitulo+" · responsáveis: "+t.responsaveis.join(", ")),
    h("div",{class:"acts"},h("button",{class:"btn",onclick:()=>{ ST.aberta=null; render(); }},"Fechar"),gravar),
    h("div",{class:"sep"}),
    h("div",{class:"field",style:"margin:0"},h("span",{class:"lbl"},"Comentários"),coms,com),
    h("div",{class:"acts"},enviar));
}

sb.auth.onAuthStateChange((ev,session)=>{
  const antes=ST.user&&ST.user.id; ST.user=session?session.user:null;
  if(ev==="PASSWORD_RECOVERY") ST.recuperar=true;
  if(!ST.user){ ST.tarefas=null; ST.erro=""; ST.aberta=null; }
  setTimeout(()=>{ render(); if(ST.user&&!ST.recuperar&&ST.user.id!==antes) carregar(); },0);
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ST.user&&!ST.recuperar&&!ST.aberta&&!ST.carregando) carregar(); });
})();
