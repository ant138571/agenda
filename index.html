<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda de Tarefas</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<meta name="description" content="Organizador de tarefas com grupos, importância, prioridade e relatório.">
<link rel="manifest" href="manifest.webmanifest?v=7">
<link rel="icon" href="icons/icon-192.png?v=7">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --side:#FAF9F7; --soft:#F6F5F2; --ink:#1C1B1A; --muted:#6B665F; --faint:#A19D96;
  --line:#ECE9E4; --line-strong:#DAD5CD; --hover:#F6F5F2;
  --accent:#F0643C; --accent-ink:#FFFFFF; --accent-soft:#FFEDE6; --accent-text:#B83E1C;
  --imp:#F5A524; --p1:#F0643C; --p2:#CFCAC2; --p3:#9BC7AA; --danger:#D93A2B; --ok:#2F9E5F;
  --warn:#FFC247; --warn-ink:#4A3200; --grip:#C4BFB7;
  --shadow:0 1px 2px rgba(30,25,20,.06),0 8px 24px rgba(30,25,20,.08);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#161514; --panel:#1F1D1B; --side:#1A1917; --soft:#262422; --ink:#F2EFEA; --muted:#B0AAA1; --faint:#7D776F;
    --line:#2E2B28; --line-strong:#3D3935; --hover:#282623;
    --accent:#FF7A52; --accent-ink:#1C1B1A; --accent-soft:#3A241C; --accent-text:#FF9A78;
    --imp:#F5B544; --p1:#FF7A52; --p2:#5A5550; --p3:#6FA886; --danger:#FF6B5E; --ok:#5CC98A;
    --warn:#E0A83A; --warn-ink:#2A1C00; --grip:#5A5550;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161514; --panel:#1F1D1B; --side:#1A1917; --soft:#262422; --ink:#F2EFEA; --muted:#B0AAA1; --faint:#7D776F;
  --line:#2E2B28; --line-strong:#3D3935; --hover:#282623;
  --accent:#FF7A52; --accent-ink:#1C1B1A; --accent-soft:#3A241C; --accent-text:#FF9A78;
  --imp:#F5B544; --p1:#FF7A52; --p2:#5A5550; --p3:#6FA886; --danger:#FF6B5E; --ok:#5CC98A;
  --warn:#E0A83A; --warn-ink:#2A1C00; --grip:#5A5550;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;background:var(--bg)}
html,body{height:100%}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:260px 1fr;height:100%;min-height:0}
.app.has-detail{grid-template-columns:260px 1fr 380px}

/* ---------- Menu lateral ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.side-head h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--imp)} .dot.off{background:var(--faint)}
.search{margin:6px 14px 10px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:0;border-radius:12px;background:var(--soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.nav{overflow-y:auto;flex:1;padding:0 8px 12px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;text-align:left;font-weight:500}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.nav-item svg{flex:none;color:var(--muted)}
.nav-item.active svg{color:var(--accent-text)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tag-swatch{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px}
.new-tag{display:flex;gap:6px;padding:4px 8px}
.new-tag input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.side-foot{border-top:1px solid var(--line);padding:8px}

/* ---------- Área principal ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.band{padding:22px 32px 10px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.band .eyebrow{font-size:13px;font-weight:700;color:var(--accent-text);text-transform:capitalize;font-variant-numeric:tabular-nums}
.band .eyebrow:empty{display:none}
.band h2{font-weight:800;font-size:30px;margin:0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.band .sub{color:var(--muted);margin-top:3px;font-size:14px}
.band .sub:empty{display:none}
.band .band-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none;border:0;background:var(--soft);color:var(--ink);border-radius:14px;width:44px;height:44px;padding:0}
.content{flex:1;overflow-y:auto;padding:8px 32px 28px;min-height:0}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1280px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.small{padding:5px 11px;font-size:13px}
.btn.pill{border:0;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;font-weight:700;font-size:13px;padding:7px 14px}
.btn.pill:hover{filter:brightness(.97)}
.btn-ghost{border:1px solid var(--line);background:var(--panel)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;color:var(--muted);border-radius:8px;font-weight:600}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flabel{color:var(--muted);margin-right:6px}
.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.check-lbl{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}

/* adicionar */
.add{background:var(--soft);border-radius:14px;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px}
.add input[type=text]{flex:1 1 140px;border:0;background:none;padding:10px 0;min-width:0;outline:none}
.add input[type=date]{border:0;border-radius:9px;padding:7px 8px;background:var(--panel);font-size:13px;color:var(--muted);max-width:140px}
.add-btn{width:40px;height:40px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;flex:none}
.hint{font-size:12px;color:var(--faint);margin-top:-8px;padding-left:4px}
.hint code{font-size:11.5px;background:var(--soft);padding:1px 5px;border-radius:5px;color:var(--muted)}

/* tarefas */
.group-title{font-weight:700;font-size:14px;color:var(--muted);margin:8px 0 -6px;display:flex;align-items:baseline;gap:8px}
.group-title .n{font-size:12px;color:var(--faint);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.task{position:relative;height:56px;flex:none;border-radius:14px;transition:transform .18s ease;outline-offset:1px}
.swipe-bg{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:13px;font-weight:700;opacity:0;pointer-events:none}
.swipe-bg.l{background:var(--warn);color:var(--warn-ink)}
.swipe-bg.r{background:var(--danger);color:#fff;justify-content:flex-end}
.task.go-right .swipe-bg.l,.task.go-left .swipe-bg.r{opacity:var(--p,0)}
.swipe-bg span{transition:transform .12s}
.task.armed .swipe-bg span{transform:scale(1.08)}
.t-card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:4px;padding:0 2px 0 2px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;transition:transform .22s ease,box-shadow .15s,border-color .15s}
.task:hover .t-card{border-color:var(--line-strong)}
.task.sel .t-card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.task.swiping .t-card,.task.dragging .t-card{transition:none}
.task.dragging{z-index:5;transition:none}
.task.dragging .t-card{box-shadow:0 14px 30px rgba(30,25,20,.18);border-color:var(--line-strong)}
.list.reordering .task:not(.dragging){pointer-events:none}
.check{width:40px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;flex:none}
.check>span{width:22px;height:22px;border-radius:50%;border:2px solid var(--p2);display:grid;place-items:center;color:var(--bg);transition:border-color .12s,background .12s}
.task.p1 .check>span{border-color:var(--p1)}
.check:hover>span{border-color:var(--accent)}
.task.done .check>span{background:var(--ink);border-color:var(--ink)}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .t-title{text-decoration:line-through;color:var(--faint);font-weight:500}
.t-meta{display:flex;gap:5px;align-items:center;font-size:11.5px;white-space:nowrap;overflow:hidden}
.m-late{color:var(--danger);font-weight:700}
.m-due{color:var(--muted);font-weight:600}
.m-due.today{color:var(--accent-text)}
.m-p1{background:var(--p1);color:#fff;font-weight:800;padding:0 6px;border-radius:6px;line-height:17px}
.m-p3{color:var(--faint);font-weight:700}
.m-low{color:var(--faint)}
.tagchip{border:0;padding:0 8px;line-height:18px;border-radius:999px;font-size:11.5px;font-weight:600;flex:none;
  background:color-mix(in srgb,var(--tc) 16%,var(--panel));color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.tagchip:hover{background:color-mix(in srgb,var(--tc) 26%,var(--panel))}
.star-ic{color:var(--imp);flex:none;display:inline-grid;padding:0 4px}
.t-actions{display:none;gap:2px;flex:none}
@media (hover:hover){ .task:hover .t-actions,.task:focus-within .t-actions{display:flex} }
.act{width:32px;height:32px;border:0;border-radius:9px;background:none;color:var(--faint);display:grid;place-items:center;padding:0}
.act:hover{background:var(--hover);color:var(--ink)}
.act-del:hover{color:var(--danger)}
.act-sun.on{color:var(--imp)}
.grip{width:32px;height:44px;border:0;background:none;color:var(--grip);touch-action:none;cursor:grab;display:grid;place-items:center;padding:0;flex:none}
.grip:hover{color:var(--muted)}
.task.dragging .grip{cursor:grabbing}
.m-steps{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-weight:700}
.m-steps.all{color:var(--ok)}
.steps{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step{display:flex;align-items:flex-start;gap:2px;border-bottom:1px solid var(--line);padding-right:4px}
.step .check{width:38px;height:40px;flex:none}
.step .act{margin-top:5px}
.step .check>span{width:18px;height:18px}
.step.done .check>span{background:var(--ink);border-color:var(--ink)}
.field .step textarea,.step textarea{flex:1;min-width:0;min-height:0;border:0;border-radius:0;background:none;padding:10px 2px;outline:none;font-size:14px;line-height:1.35;resize:none;overflow:hidden}
.step.done textarea{text-decoration:line-through;color:var(--faint)}
.step .act{width:30px;height:30px;opacity:.55}
.step:hover .act,.step:focus-within .act{opacity:1}
.step-add{display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--accent-text)}
.field .step-add input,.step-add input{border:0!important;flex:1;border:0;background:none;padding:10px 0;outline:none;font-size:14px}
.steps-count{font-weight:500;color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1.5px dashed var(--line);border-radius:14px;font-size:14px}
.gest-hint{font-size:11.5px;color:var(--faint);text-align:center;padding:2px 4px}
.touch-only{display:none}
@media (hover:none){ .touch-only{display:inline} .mouse-only{display:none} }

/* ---------- Início ---------- */
.timeline{border-bottom:1px solid var(--line);margin-top:-4px}
.tl-scroll{position:relative;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:4px;padding:2px 0 8px;overscroll-behavior-x:contain}
.tl-scroll::-webkit-scrollbar{display:none}
.tl-track{display:flex;width:max-content;padding:0 4px}
.tl-day{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border:0;background:none;scroll-snap-align:start;border-radius:12px;color:var(--ink)}
.tl-wd{font-size:11px;font-weight:700;color:var(--faint);line-height:14px}
.tl-wd.mon{color:var(--accent-text)}
.tl-num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .12s}
.tl-day:hover .tl-num{background:var(--hover)}
.tl-day.weekend .tl-num{color:var(--faint)}
.tl-day.late .tl-num{color:var(--danger)}
.tl-day.is-today .tl-wd{color:var(--accent-text)}
.tl-day.is-today .tl-num{background:var(--accent);color:#fff}
.tl-day.is-sel:not(.is-today) .tl-num{background:var(--ink);color:var(--bg)}
.tl-dots{height:6px;display:flex;gap:3px}
.tl-dots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}
.home-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.col-day,.col-week{display:flex;flex-direction:column;gap:10px;min-width:0}
.col-week{border-left:1px solid var(--line);padding-left:24px}
.col-head{display:flex;align-items:baseline;gap:8px;min-height:32px}
.col-head h3{font-size:18px;font-weight:800;margin:0;white-space:nowrap}
.col-head .col-count{font-size:12.5px;color:var(--muted);white-space:nowrap}
.col-head .btn{margin-left:auto;align-self:center}
.wk-day{display:flex;flex-direction:column;gap:6px}
.wk-label{border:0;background:none;padding:0;text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk-label:hover{color:var(--accent-text)}
.later{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.later-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.later-row{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.later-row b{color:var(--ink);font-weight:600}
/* painéis recolhíveis da coluna direita (Lembretes, Urgentes, Importantes) */
.pn{display:flex;flex-direction:column;gap:8px}
.pn+.pn,.pn+.wk-head{border-top:1px solid var(--line);padding-top:12px}
.pn-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:2px 0;text-align:left;color:var(--ink);border-radius:8px}
.pn-head>span:first-child{color:var(--muted)}
.pn-head.urg>span:first-child{color:var(--p1)} .pn-head.imp>span:first-child{color:var(--imp)} .pn-head.rem>span:first-child{color:var(--accent-text)}
.pn-title{font-size:16px;font-weight:800}
.pn-n{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:0 8px;line-height:20px;font-variant-numeric:tabular-nums}
.pn-chev{margin-left:auto;color:var(--faint);transition:transform .15s}
.pn-head[aria-expanded="false"] .pn-chev{transform:rotate(-90deg)}
.pn-more{border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:700;color:var(--accent-text);text-align:left}
.pn-empty{font-size:13px;color:var(--faint);padding:2px 0 4px}
.to-day{border:0;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;font-size:12px;font-weight:700;padding:4px 9px 4px 7px;display:inline-flex;align-items:center;gap:4px;flex:none;margin-right:2px}
.to-day:hover{filter:brightness(.96)}
.m-rem{display:inline-flex;align-items:center;gap:3px;color:var(--accent-text);font-weight:700}
.m-rem.past{color:var(--muted)}
/* alarme de lembrete */
.alarms{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px))}
.alarm{background:var(--panel);border:1px solid var(--line-strong);border-left:4px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.alarm-top{display:flex;gap:10px;align-items:flex-start}
.alarm-top>span:first-child{color:var(--accent);margin-top:2px}
.alarm-title{font-weight:700;overflow-wrap:anywhere}
.alarm-time{font-size:12.5px;color:var(--muted)}
.alarm .row-end{justify-content:flex-start}

/* ---------- Detalhe ---------- */
.detail{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 16px}
.d-head span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.d-body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;flex:1}
.d-title{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.d-title textarea{flex:1;border:0;background:none;resize:none;font-size:18px;font-weight:700;line-height:1.3;outline:none;min-height:28px}
.circle{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--p2);background:none;margin-top:1px;display:grid;place-items:center;padding:0}
.circle:hover{border-color:var(--accent)}
.circle.p1{border-color:var(--p1)} .circle.p3{border-color:var(--p3)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;color:var(--muted);font-weight:600}
.field input[type=date],.field input[type=datetime-local],.field textarea,.field input[type=text]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}

.crono .evento[data-sem] .contexto{margin:.3rem 0 0}
.crono .evento[data-sem] .contexto+.contexto{margin-top:.4rem}
.crono .corpo ul{list-style:none;margin:0;padding:0;max-width:38rem}
.crono .corpo li{position:relative;padding-left:1.5rem;margin:0 0 .85rem}
.crono .corpo li .info{display:block;color:var(--suave);font-size:.88em;line-height:1.4}
.crono .corpo li::before{content:"";position:absolute;left:0;top:.82em;width:.75rem;height:2px;background:var(--c)}
.crono .passou .data,.crono .passou .corpo{opacity:.6}
.crono .cr-vazio{margin:1.5rem 0 1rem;color:var(--suave);font-style:italic}
@container (max-width:40rem){
  .crono .rotulo small{display:none}
  .crono .evento{grid-template-columns:1.75rem minmax(0,1fr)}
  .crono .trilho{grid-column:1;grid-row:1/span 2}
  .crono .data{grid-column:2;grid-row:1;padding-bottom:.7rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .8rem}
  .crono .corpo{grid-column:2;grid-row:2}
  .crono .proximo{margin-top:0}
  .crono .escala{height:7rem}
  .crono .barra{top:3.25rem}
  .crono .ticks{top:calc(3.25rem + 16px)}
  .crono .ponto{top:calc(3.25rem - 4px)}
  .crono .acima .rotulo{bottom:4.35rem}
  .crono .abaixo .rotulo{top:4.65rem}
}
/* página de impressão (Exportar PDF): mesma folha A4 da ferramenta */
.crono.cr-print{max-width:52rem;margin:0 auto;padding:2.5rem 1.25rem 4rem;min-height:100vh}
@media print{
  @page{size:A4;margin:0}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .crono .hoje{display:none!important}
  .crono.cr-print{font-size:.92rem;line-height:1.45;max-width:none;padding:13mm 16mm 10mm;min-height:0}
  .crono.cr-print .cr-titulo{font-size:1.95rem}
  .crono.cr-print .periodo{margin-top:.6rem;font-size:.98rem}
  .crono.cr-print .faixa{margin:1.6rem 0 1.7rem}
  .crono.cr-print .escala{height:7.6rem}
  .crono.cr-print .barra{top:3.5rem}
  .crono.cr-print .ticks{top:calc(3.5rem + 16px)}
  .crono.cr-print .ponto{top:calc(3.5rem - 4px)}
  .crono.cr-print .acima .rotulo{bottom:4.6rem}
  .crono.cr-print .abaixo .rotulo{top:4.9rem}
  .crono.cr-print .evento{grid-template-columns:7.75rem 2.25rem minmax(0,1fr);break-inside:avoid}
  .crono.cr-print .data,.crono.cr-print .corpo{padding-bottom:1.3rem}
  .crono.cr-print .dia{font-size:1.7rem}
  .crono.cr-print .trilho::before{top:.935rem}
  .crono.cr-print .trilho::after{top:calc(.935rem - 8px)}
  .crono.cr-print .contexto{margin-bottom:.5rem}
  .crono.cr-print .corpo ul{max-width:none}
  .crono.cr-print .corpo li{margin-bottom:.5rem}
  .crono.cr-print .passou .data,.crono.cr-print .passou .corpo{opacity:1}
  .crono.cr-print .proximo{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="side-head">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
      <div>
        <h1>Agenda de Tarefas</h1>
        <div class="sync" id="sync"><span class="dot off"></span><span>Conectando…</span></div>
      </div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Pesquisar tarefas  ( / )" autocomplete="off" aria-label="Pesquisar tarefas">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="nav-item" id="configBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        Configurações
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="band">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div>
        <div class="eyebrow" id="viewEyebrow"></div>
        <h2 id="viewTitle">Início</h2>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="band-actions" id="bandActions"></div>
      <button class="btn small" id="mselBtn" hidden title="Selecionar várias tarefas (ou Ctrl + clique)"></button>
    </header>
    <div class="content" id="content"><div class="wrap" id="wrap"></div></div>
  </main>

  <aside class="detail" id="detail" hidden></aside>
</div>
<div id="modalRoot"></div>

<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
/* ================= Utilidades ================= */
const $ = (s,el=document)=>el.querySelector(s);
const h = (tag, attrs={}, ...kids)=>{
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="html") el.innerHTML=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
};
const svg = (d,size=18,extra="")=>{const s=document.createElement("span");s.style.display="inline-grid";s.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${extra.includes("fill=")?"":'fill="none"'} ${extra} stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;return s;};
const ICON={
  home:'<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  calx:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15h6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  report:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  select:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><path d="M5.3 7.2l1.3 1.3L9 6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M14 7h7M14 17h7"/>',
  grip:'<circle cx="9" cy="6" r=".8"/><circle cx="15" cy="6" r=".8"/><circle cx="9" cy="12" r=".8"/><circle cx="15" cy="12" r=".8"/><circle cx="9" cy="18" r=".8"/><circle cx="15" cy="18" r=".8"/>'
};
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>ymd(new Date());
const DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtShort=s=>{const d=parseYmd(s);return `${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`;};
const fmtBR=s=>{if(!s)return "";const [y,m,d]=s.slice(0,10).split("-");return `${d}/${m}/${y}`;};
const fmtLong=d=>d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const fmtDue=s=>{const d=parseYmd(s);return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;};
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
/* lembrete: guardado como data/hora ISO (UTC); exibido no horário local */
const fmtRemind=iso=>{const d=new Date(iso), k=ymd(d); if(k===today()) return "hoje "+hm(d); if(k===ymd(addDays(new Date(),1))) return "amanhã "+hm(d); return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)} ${hm(d)}`;};
const toLocalInput=iso=>{const d=new Date(iso); return isNaN(d)?"":`${ymd(d)}T${hm(d)}`;};
const uid=()=> "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const normTag=s=>String(s).trim().replace(/^#+/,"").toLowerCase().replace(/\s+/g,"-").replace(/[^\p{L}\p{N}_.\-]/gu,"").slice(0,40);
const TAG_COLORS=["#2F6FB0","#B5563A","#3C8A5E","#8A5AB5","#B08A2F","#2F8C95","#B54A7A","#5C6BC0","#7A8B2F","#C0662F"];
const IMP={3:"Alta",2:"Média",1:"Baixa"};
const PRI={1:"P1 · Urgente",2:"P2 · Normal",3:"P3 · Pode esperar"};
const lsGet=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let toastTimer;
function toast(msg,undo){
  let t=$("#toast");
  if(!t){t=h("div",{class:"toast",id:"toast",role:"status"});document.body.append(t);}
  t.replaceChildren(h("span",{},msg));
  if(undo) t.append(h("button",{class:"toast-undo",onclick:()=>{t.hidden=true;undo();}},"Desfazer"));
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,undo?5000:2600);
}

/* ================= Dados + sincronização ================= */
const CACHE_KEY="agenda-cache-v1", QUEUE_KEY="agenda-queue-v1", UI_KEY="agenda-ui-v1", CFG_KEY="agenda-sync-v1", PULL_KEY="agenda-lastpull-v1";
const cache=lsGet(CACHE_KEY,{tasks:{},tags:{}});
let CFG=lsGet(CFG_KEY,{url:"",key:""});
const S={
  server:{tasks:cache.tasks||{},tags:cache.tags||{},projects:cache.projects||{}},  // último estado confirmado (cópia local)
  queue:lsGet(QUEUE_KEY,[]),                            // alterações ainda não enviadas
  lastPull:lsGet(PULL_KEY,0),
  sb:null, user:null, mode:"local", busy:false, again:false, lastError:""
};
/* versão dos dados: ao subir, baixa tudo de novo do servidor uma vez (recupera projetos que uma versão antiga
   do app descartou da cópia local sem baixá-los novamente) */
const DATA_VER_KEY="agenda-dataver-v1", DATA_VER=2;
if(lsGet(DATA_VER_KEY,0)<DATA_VER){ S.lastPull=0; lsSet(PULL_KEY,0); lsSet(DATA_VER_KEY,DATA_VER); }
function applyToServer(op){
  if(op.path.startsWith("tasks/")){const id=op.path.slice(6); if(op.op==="delete") delete S.server.tasks[id]; else S.server.tasks[id]=op.data;}
  else if(op.path==="meta/tags"){ S.server.tags=(op.op==="delete"||!op.data)?{}:(op.data.map||{}); }
  else if(op.path.startsWith("projects/")){ const id=op.path.slice(9); S.server.projects=S.server.projects||{}; if(op.op==="delete"||!op.data) delete S.server.projects[id]; else S.server.projects[id]=op.data; }
}
function applyQueue(base){
  const saved=S.server; S.server={tasks:{...base.tasks},tags:{...base.tags},projects:{...(base.projects||{})}};
  for(const op of S.queue) applyToServer(op);
  const out=S.server; S.server=saved; return out;
}
let VIEW={tasks:{},tags:{},projects:{}};
function recompute(){ VIEW=applyQueue(S.server); }
function saveCache(){ lsSet(CACHE_KEY,S.server); lsSet(QUEUE_KEY,S.queue); lsSet(PULL_KEY,S.lastPull); }
function enqueueMany(ops){
  if(!ops.length) return;
  // guarda só a última alteração de cada documento
  const paths=new Set(ops.map(o=>o.path));
  S.queue=S.queue.filter(q=>!paths.has(q.path)); S.queue.push(...ops);
  saveCache(); recompute(); render(); scheduleSync(800);
}
function enqueue(op){ enqueueMany([op]); }
const tsOf=s=>{ if(!s) return 0; const t=Date.parse(String(s).replace(/(\.\d{3})\d+/,"$1")); return isNaN(t)?0:t; };
async function pushQueue(){
  while(S.queue.length){
    const chunk=S.queue.slice(0,200);
    const rows=chunk.map(o=>({user_id:S.user.id,id:o.path,data:o.op==="delete"?null:o.data,deleted:o.op==="delete"}));
    const {error}=await S.sb.from("docs").upsert(rows,{onConflict:"user_id,id"});
    if(error) throw error;
    for(const o of chunk){ applyToServer(o); const i=S.queue.indexOf(o); if(i>=0) S.queue.splice(i,1); }
    saveCache();
  }
}
async function pullChanges(){
  const since=new Date(Math.max(0,(S.lastPull||0)-120000)).toISOString();
  let from=0, max=S.lastPull||0, changed=false;
  for(;;){
    const {data,error}=await S.sb.from("docs").select("id,data,deleted,updated_at").gt("updated_at",since).order("updated_at",{ascending:true}).range(from,from+999);
    if(error) throw error;
    for(const r of data){ applyToServer({op:r.deleted?"delete":"set",path:r.id,data:r.data}); max=Math.max(max,tsOf(r.updated_at)); changed=true; }
    if(data.length<1000) break; from+=1000;
  }
  S.lastPull=max; saveCache();
  if(changed){ recompute(); render(); }
}
async function sync(){
  if(!S.sb||!S.user) { updateSync(); return; }
  if(S.busy){ S.again=true; return; }
  S.busy=true; updateSync();
  try{
    await pushQueue(); await pullChanges();
    S.mode="online"; S.lastError="";
  }catch(e){
    const msg=(e&&(e.message||e.error_description))||String(e);
    if(!navigator.onLine||/fetch|network|Failed|Load failed/i.test(msg)){ S.mode="offline"; S.lastError=""; }
    else { S.mode="error"; S.lastError=msg; }
  }finally{
    S.busy=false; updateSync(); renderSettingsIfOpen();
    if(S.again){ S.again=false; scheduleSync(300); }
  }
}
let syncTimer=null;
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,ms); }
function updateSync(){
  const el=$("#sync"); if(!el) return;
  const n=S.queue.length; let cls="dot", txt="Sincronizado";
  if(!S.sb||!S.user){ cls="dot off"; txt="Salvo só neste aparelho"; }
  else if(S.busy){ cls="dot warn"; txt=n?`Enviando ${n} alteração(ões)…`:"Sincronizando…"; }
  else if(!navigator.onLine||S.mode==="offline"){ cls="dot warn"; txt=n?`Offline · ${n} alteração(ões) a enviar`:"Offline · usando cópia local"; }
  else if(S.mode==="error"){ cls="dot warn"; txt="Erro ao sincronizar (veja Sincronização)"; }
  else if(n){ cls="dot warn"; txt=`${n} alteração(ões) a enviar`; }
  el.innerHTML=`<span class="${cls}"></span><span>${esc(txt)}</span>`;
}
function initClient(){
  S.sb=null; S.user=null;
  if(!CFG.url||!CFG.key){ updateSync(); return; }
  if(!window.supabase||!window.supabase.createClient){ S.lastError="Biblioteca de sincronização não carregou."; updateSync(); return; }
  try{
    S.sb=window.supabase.createClient(CFG.url.trim(),CFG.key.trim(),{auth:{persistSession:true,autoRefreshToken:true,storageKey:"agenda-auth"}});
  }catch(e){ S.sb=null; S.lastError="Endereço ou chave do Supabase inválidos."; updateSync(); return; }
  S.sb.auth.onAuthStateChange((ev,session)=>{
    S.user=session?session.user:null;
    setTimeout(()=>{ updateSync(); renderSettingsIfOpen(); if(S.user){ sync(); ensurePush(); } },0);
  });
}
window.addEventListener("online",()=>scheduleSync(200));
window.addEventListener("offline",()=>{ S.mode="offline"; updateSync(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") scheduleSync(200); });
setInterval(()=>{ if(document.visibilityState==="visible"&&S.user&&navigator.onLine) sync(); },30000);

/* ================= Modelo ================= */
const tasksArr=()=>Object.entries(VIEW.tasks).map(([id,t])=>({id,...t}));
function allTags(){
  const m={...VIEW.tags};
  for(const t of tasksArr()) for(const g of (t.tags||[])) if(!m[g]) m[g]={color:null};
  const names=Object.keys(m).sort((a,b)=>a.localeCompare(b,"pt-BR"));
  names.forEach((n,i)=>{ if(!m[n].color) m[n]={...m[n],color:TAG_COLORS[hash(n)%TAG_COLORS.length]}; });
  return {names,map:m};
}
function hash(s){let x=0;for(const c of s)x=(x*31+c.codePointAt(0))>>>0;return x;}
const safeColor=c=>typeof c==="string"&&/^#[0-9a-f]{3,8}$/i.test(c)?c:null;  // só cores #hex (a cor vai para atributos style)
const tagColor=n=>{const m=VIEW.tags[n];return (m&&safeColor(m.color))||TAG_COLORS[hash(n)%TAG_COLORS.length];};
function saveTags(map){ enqueue({op:"set",path:"meta/tags",data:{map}}); }
function ensureTags(list){
  const m={...VIEW.tags}; let changed=false;
  for(const n of list) if(!m[n]){ m[n]={color:TAG_COLORS[hash(n)%TAG_COLORS.length]}; changed=true; }
  if(changed) saveTags(m);
}
function putTask(id,data){ const clean={...data}; delete clean.id; clean.updatedAt=new Date().toISOString(); enqueue({op:"set",path:"tasks/"+id,data:clean}); }
function patchTask(id,patch){ const cur=VIEW.tasks[id]; if(!cur) return; putTask(id,{...cur,...patch}); }
function deleteTask(id){ if(UI.sel===id){UI.sel=null;} enqueue({op:"delete",path:"tasks/"+id}); }
/* valida uma tarefa vinda de arquivo de backup: só campos conhecidos e com o tipo certo */
function cleanTask(t){
  if(!t||typeof t!=="object"||typeof t.title!=="string"||!t.title.trim()) return null;
  const str=(v,max=40)=>typeof v==="string"?v.slice(0,max):null, lvl=v=>[1,2,3].includes(v)?v:2;
  const c={title:t.title.slice(0,500),tags:Array.isArray(t.tags)?[...new Set(t.tags.map(normTag).filter(Boolean))]:[],
    due:typeof t.due==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(t.due)?t.due:null,importance:lvl(t.importance),priority:lvl(t.priority),
    done:t.done===true,doneAt:str(t.doneAt),myDay:str(t.myDay),notes:typeof t.notes==="string"?t.notes.slice(0,20000):"",createdAt:str(t.createdAt)||new Date().toISOString()};
  if(Array.isArray(t.steps)) c.steps=t.steps.filter(x=>x&&typeof x.title==="string").slice(0,200).map((x,i)=>({id:str(x.id)||"s"+(i+1),title:x.title.slice(0,500),done:x.done===true}));
  if(typeof t.ord==="number"&&isFinite(t.ord)) c.ord=t.ord;
  if(str(t.remindAt)&&!isNaN(Date.parse(t.remindAt))) c.remindAt=t.remindAt;
  // recorrência
  if(t.repeat&&typeof t.repeat==="object"&&["daily","weekdays","weekly","monthly"].includes(t.repeat.freq)){
    const r={freq:t.repeat.freq};
    if(Array.isArray(t.repeat.days)) r.days=[...new Set(t.repeat.days.filter(x=>Number.isInteger(x)&&x>=0&&x<=6))];

/* ---------- Recorrência ----------
   repeat:{freq:"daily"|"weekdays"|"weekly"|"monthly", days:[0-6] (semanal), day:1-31 (mensal)}
   O prazo (due) é a próxima ocorrência em aberto; doneDates guarda as datas já concluídas e skipDates as puladas.
   A tarefa nunca fica “concluída”: ao concluir uma data, o prazo passa para a próxima ocorrência. */
const REP_LABEL={daily:"Diária",weekdays:"Dias úteis",weekly:"Semanal",monthly:"Mensal"};
const isRec=t=>!!(t&&t.repeat&&REP_LABEL[t.repeat.freq]&&t.due);
function occursOn(t,key){
  const r=t.repeat, d=parseYmd(key), w=d.getDay();
  if(r.freq==="daily") return true;
  if(r.freq==="weekdays") return w>=1&&w<=5;
  if(r.freq==="weekly") return (Array.isArray(r.days)&&r.days.length?r.days:[parseYmd(t.due).getDay()]).includes(w);
  if(r.freq==="monthly"){ const md=r.day||parseYmd(t.due).getDate(), last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()===Math.min(md,last); }

}
const recClosed=(t,key)=>(t.doneDates||[]).includes(key)||(t.skipDates||[]).includes(key);
/* próxima ocorrência em aberto depois de “after” (exclusivo) */
function nextOcc(t,after){ let d=addDays(parseYmd(after),1); for(let i=0;i<800;i++,d=addDays(d,1)){ const k=ymd(d); if(occursOn(t,k)&&!recClosed(t,k)) return k; } return null; }

/* a tarefa recorrente tem ocorrência em aberto neste dia (do prazo atual em diante) */
const recOn=(t,key)=>isRec(t)&&!t.done&&(key===t.due||(key>t.due&&occursOn(t,key)&&!recClosed(t,key)));
/* tarefa aberta com prazo neste dia (inclui as próximas ocorrências das recorrentes) */
const dueOn=(t,key)=>!t.done&&(t.due===key||recOn(t,key));

}
function recDonePatch(t,key){

function restoreTask(id,data){ enqueue({op:"set",path:"tasks/"+id,data:{...data,updatedAt:new Date().toISOString()}}); }

/* o que o gesto “deslizar para a direita” faz, conforme onde a tarefa aparece */
function rightAction(t,dayKey){
  const td=today();
  // recorrente numa data futura: pula só aquela data (a repetição continua)

    if(t.done) return {label:"Reabrir",msg:"Data reaberta",run:()=>toggleDone(t.id,dayKey)};

const TL_PAST=90, TL_FUT=180;
function timeline(sel){

  const recs=tasksArr().filter(isRec);

  for(let i=-TL_PAST;i<=TL_FUT;i++){
    const d=addDays(base,i), key=ymd(d), items=sortTasks([...(byDay[key]||[]),...recs.filter(t=>key!==t.due&&recOn(t,key))],"manual"), n=items.length;
    const first=d.getDate()===1;

    const flags=(urg?" · urgente":"")+(imp?" · importante":"");
    const cls="tl-day"+(key===td?" is-today":"")+(key===sel?" is-sel":"")+(d.getDay()===0||d.getDay()===6?" weekend":"")+(n&&key<td?" late":"");
    track.append(h("button",{class:cls,title:`${fmtShort(key)} · ${n} tarefa${n===1?"":"s"}${flags}`,"aria-label":`${fmtShort(key)}, ${n} tarefa${n===1?"":"s"}${flags}`,"aria-pressed":key===sel?"true":"false",
        onclick:()=>{UI.homeDay=key===td?null:key;render();}},
      h("span",{class:"tl-wd"+(first?" mon":"")},first?MESES[d.getMonth()]:DIAS[d.getDay()][0].toUpperCase()),
      h("span",{class:"tl-num"},d.getDate()),
      h("span",{class:"tl-dots"},items.slice(0,3).map(t=>h("i",{style:`--tc:${t.tags&&t.tags[0]?tagColor(t.tags[0]):"var(--faint)"}`})),
        urg?tlIc(ICON.bolt,"urg"):null,imp?tlIc(ICON.star,"imp"):null)));

  return h("section",{class:"timeline","aria-label":"Linha do tempo"},sc);

function sortTasks(list,by){
  const key={
    due:t=>(t.due||"9999")+(t.priority||2)+(4-(t.importance||2)),
    priority:t=>`${t.priority||2}${4-(t.importance||2)}${t.due||"9999"}`,
    importance:t=>`${4-(t.importance||2)}${t.priority||2}${t.due||"9999"}`,
    created:t=>String(9e15-Date.parse(t.createdAt||0)).padStart(16,"0"),
    title:t=>t.title.toLowerCase()
  };
  if(by==="manual"){
    // ordem definida arrastando; tarefas ainda não ordenadas vêm depois, por prioridade
    return [...list].sort((a,b)=>{ const x=a.ord??Infinity, y=b.ord??Infinity; if(x!==y) return x<y?-1:1; const p=key.priority(a), q=key.priority(b); return p<q?-1:p>q?1:0; });
  }
  const k=key[by]||(t=>t.title);
  return [...list].sort((a,b)=>{const x=k(a),y=k(b);return x<y?-1:x>y?1:0;});
}
/* ---------- Pesquisa inteligente: ignora acentos e maiúsculas, aceita erros de digitação e palavras incompletas ---------- */
const fold=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const wordsOf=s=>fold(s).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
/* distância de edição (inclui letras trocadas de lugar), interrompida ao passar de “max” */
function editDist(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let p2=null, p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,p2[j-2]+1);
      c[j]=v; if(v<rowMin) rowMin=v;
    }
    if(rowMin>max) return max+1;
    p2=p; p=c;
  }
  return p[b.length];
}
const typoTol=n=>n<=2?0:n<=4?1:2;   // erros aceitos conforme o tamanho da palavra digitada
function tokenScore(tok,ws,text){
  let best=0; const tol=typoTol(tok.length);
  for(const w of ws){
    if(w===tok) return 3;
    if(w.startsWith(tok)){ best=Math.max(best,2.5); continue; }
    if(w.includes(tok)){ best=Math.max(best,2); continue; }
    if(!tol||best>=1.5) continue;
    let d=editDist(tok,w,tol);
    if(d>tol&&w.length>tok.length&&tok.length>=4) d=Math.min(editDist(tok,w.slice(0,tok.length),tol),editDist(tok,w.slice(0,tok.length+1),tol));   // palavra ainda sendo digitada
    if(d<=tol) best=Math.max(best,1.5-d*.4);
  }
  if(!best&&text.includes(tok)) best=2;
  return best;
}
function searchTasks(list,q){
  const toks=wordsOf(q); if(!toks.length) return list;
  const out=[];
  for(const t of list){
    const fields=[[t.title,2],[(t.tags||[]).join(" "),1.5],[(t.notes||"")+" "+(t.steps||[]).map(x=>x.title).join(" "),1]].map(([s,w])=>({ws:wordsOf(s),text:fold(s),w}));
    let total=0, ok=true;
    for(const tok of toks){ let b=0; for(const f of fields) b=Math.max(b,tokenScore(tok,f.ws,f.text)*f.w); if(!b){ ok=false; break; } total+=b; }
    if(ok) out.push([total,t]);
  }

}

function rowKey(e,id){
  if(e.target!==e.currentTarget) return;
  if(e.key==="Enter"){ select(id); return; }
  if(e.key==="Delete"){ removeTask(id); return; }
  if(e.altKey&&(e.key==="ArrowUp"||e.key==="ArrowDown")){
    const row=e.currentTarget; if(!row.querySelector(".grip")) return;
    e.preventDefault();
    const ids=[...row.parentElement.children].filter(r=>r.querySelector(".grip")).map(r=>r.dataset.id);
    const i=ids.indexOf(id), j=i+(e.key==="ArrowUp"?-1:1); if(j<0||j>=ids.length) return;
    ids.splice(i,1); ids.splice(j,0,id); applyOrder(ids);

  }

document.addEventListener("pointerdown",e=>{
  LAST_PTR=e.pointerType; LAST_PTR_AT=Date.now();
  if(G||e.button>0) return;
  const card=e.target.closest(".t-card"); if(!card) return;
  const row=card.parentElement;
  if(e.target.closest(".grip")) return startDrag(e,row);
  if(e.target.closest("input,textarea,select")) return;
  G={type:"pending",row,card,x:e.clientX,y:e.clientY,pid:e.pointerId,dx:0};
  // toque longo (celular): grupo, importância e prioridade sem abrir a tarefa
  if(e.pointerType==="touch"&&!UI.multiOn&&!e.target.closest(".check,.act,.tagchip,.to-day")){
    const g=G;
    g.lp=setTimeout(()=>{ if(G!==g||g.type!=="pending") return; G=null; LP_FIRED=true;
      try{ if(navigator.vibrate) navigator.vibrate(12); }catch(err){}
      const r=g.card.getBoundingClientRect(), fx=(g.x-r.left)/(r.width||1);
      openWheel(g.row.dataset.id,fx<1/3?"group":fx<2/3?"imp":"pri",g.x,g.y); },LP_MS);
  }
});
// no celular, o toque longo não abre o menu do sistema nem o do clique direito
document.addEventListener("contextmenu",e=>{ if(LAST_PTR==="touch"&&Date.now()-LAST_PTR_AT<3000&&e.target.closest&&e.target.closest(".t-card")){ e.preventDefault(); e.stopPropagation(); } },true);
function startDrag(e,row){
  const list=row.parentElement;
  const rows=[...list.children].filter(r=>r.classList.contains("task")&&r.querySelector(".grip"));
  const from=rows.indexOf(row); if(from<0) return;
  e.preventDefault();
  const rects=rows.map(r=>r.getBoundingClientRect());
  const gap=rects.length>1?Math.max(0,rects[1].top-rects[0].bottom):6;
  try{ e.target.closest(".grip").setPointerCapture(e.pointerId); }catch(err){}
  G={type:"drag",row,list,rows,rects,from,to:from,pitch:rects[from].height+gap,y:e.clientY,st:$("#content").scrollTop,pid:e.pointerId};
  GESTURE=true; row.classList.add("dragging"); list.classList.add("reordering");
}
window.addEventListener("pointermove",e=>{
  if(!G||e.pointerId!==G.pid) return;
  if(G.type==="drag") return moveDrag(e);
  const dx=e.clientX-G.x, dy=e.clientY-G.y;
  if(G.type==="pending"){
    if(UI.multiOn){ if(Math.abs(dx)>10||Math.abs(dy)>10){ clearTimeout(G.lp); G=null; } return; }   // selecionando: sem deslizar
    if(Math.abs(dx)>10||Math.abs(dy)>10) clearTimeout(G.lp);
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){
      G.type="swipe"; GESTURE=true; G.row.classList.add("swiping");
      try{ G.card.setPointerCapture(G.pid); }catch(err){}
    } else if(Math.abs(dy)>10){ G=null; return; }
    else return;
  }
  G.dx=dx;
  G.card.style.transform=`translateX(${dx}px)`;
  G.row.style.setProperty("--p",Math.min(1,Math.abs(dx)/SWIPE_TH).toFixed(2));
  G.row.classList.toggle("go-left",dx<0); G.row.classList.toggle("go-right",dx>0);
  G.row.classList.toggle("armed",Math.abs(dx)>SWIPE_TH);
},{passive:true});
function moveDrag(e){
  const sc=$("#content"), cr=sc.getBoundingClientRect();
  if(e.clientY>cr.bottom-50) sc.scrollTop+=12; else if(e.clientY<cr.top+50) sc.scrollTop-=12;
  const dy=e.clientY-G.y+(sc.scrollTop-G.st);
  G.row.style.transform=`translateY(${dy}px)`;
  const r0=G.rects[G.from], center=r0.top+r0.height/2+dy;
  let to=G.from;
  G.rects.forEach((r,i)=>{ const mid=r.top+r.height/2; if(i<G.from&&center<mid) to=Math.min(to,i); if(i>G.from&&center>mid) to=Math.max(to,i); });
  G.to=to;
  G.rows.forEach((r,i)=>{ if(i===G.from) return;
    let y=0; if(G.from<to&&i>G.from&&i<=to) y=-G.pitch; else if(G.from>to&&i>=to&&i<G.from) y=G.pitch;
    r.style.transform=y?`translateY(${y}px)`:""; });
}
function endGesture(e,cancelled){
  if(!G||(e&&e.pointerId!==G.pid)) return;
  const g=G; G=null;
  if(g.type==="pending"){ clearTimeout(g.lp); return; }
  swallowNextClick();
  if(g.type==="drag"){
    g.rows.forEach(r=>r.style.transform=""); g.row.classList.remove("dragging"); g.list.classList.remove("reordering");
    GESTURE=false;
    if(!cancelled&&g.to!==g.from){ const ids=g.rows.map(r=>r.dataset.id); const [m]=ids.splice(g.from,1); ids.splice(g.to,0,m); applyOrder(ids); }
    else if(pendingRender) render();
    return;
  }
  // deslizar
  const id=g.row.dataset.id, dx=g.dx;
  const reset=()=>{ g.row.classList.remove("swiping","go-left","go-right","armed"); g.card.style.transform=""; };
  if(!cancelled&&Math.abs(dx)>SWIPE_TH){
    g.card.style.transition="transform .16s ease"; g.card.style.transform=`translateX(${dx<0?-110:110}%)`;
    setTimeout(()=>{ GESTURE=false; if(dx<0) removeTask(id); else runRight(id,g.row._right); if(pendingRender) render(); },160);
  } else {
    g.row.classList.remove("swiping"); g.card.style.transform="";
    setTimeout(()=>{ reset(); GESTURE=false; if(pendingRender) render(); },220);
  }
}
window.addEventListener("pointerup",e=>{ if(LP_FIRED){ LP_FIRED=false; swallowNextClick(); } endGesture(e,false); });
window.addEventListener("pointercancel",e=>{ LP_FIRED=false; endGesture(e,true); });

/* ---------- Toque longo: roleta infinita para grupo (esquerda), importância (meio) e prioridade (direita) ----------
   Segurando: arraste para cima/baixo para girar e solte para aplicar.
   Soltou sem arrastar: a roleta fica aberta; gire com o dedo e toque no valor (ou fora, para aplicar o do centro). */
const WH_IT=44;
let WH=null;
function openWheel(id,kind,x,y){
  const t=VIEW.tasks[id]; if(!t) return;
  closeWheel(false);
  let opts, cur, title;
  if(kind==="group"){
    title="Grupo";
    opts=[{v:null,label:()=>[h("span",{},"Sem grupo")]},...allTags().names.map(n=>({v:n,label:()=>[h("span",{class:"tag-swatch",style:`background:${tagColor(n)}`}),h("span",{},"#"+n)]}))];
    cur=(t.tags||[])[0]||null;
  } else if(kind==="imp"){
    title="Importância"; opts=[3,2,1].map(v=>({v,label:()=>[v===3?svg(ICON.star,15,'fill="currentColor"'):null,h("span",{},IMP[v])]})); cur=t.importance||2;
  } else {
    title="Prioridade"; opts=[1,2,3].map(v=>({v,label:()=>[h("span",{class:"pill p"+v},"P"+v),h("span",{},PRI[v].split(" · ")[1])]})); cur=t.priority||2;
  }
  const len=opts.length, CYC=Math.max(21,Math.ceil(900/len)|1), mid=Math.floor(CYC/2);
  const curIdx=Math.max(0,opts.findIndex(o=>o.v===cur));
  const view=h("div",{class:"wheel-view",role:"listbox","aria-label":title});
  const items=[];
  view.append(h("div",{class:"wheel-sp"}));
  for(let c=0;c<CYC;c++) opts.forEach((o,k)=>{ const it=h("div",{class:"wheel-it",role:"option",onclick:()=>finish(true,k)},...o.label()); items.push(it); view.append(it); });
  view.append(h("div",{class:"wheel-sp"}));
  const box=h("div",{class:"wheel",role:"dialog","aria-label":title+": "+t.title},
    h("div",{class:"wheel-title"},title),
    h("div",{class:"wheel-box"},h("div",{class:"wheel-band"}),view),
    h("div",{class:"wheel-hint"},"Arraste para girar · solte ou toque para aplicar"));
  const bg=h("div",{class:"wheel-bg",id:"wheel",onclick:e=>{ if(e.target===bg) finish(true); }},box);
  document.body.append(bg);
  // posição: perto do dedo, dentro da tela
  const z=parseFloat(getComputedStyle(document.documentElement).zoom)||1, W=window.innerWidth/z, H=window.innerHeight/z;
  const bw=box.offsetWidth, bh=box.offsetHeight;
  box.style.left=Math.max(8,Math.min(x/z-bw/2,W-bw-8))+"px";
  box.style.top=Math.max(8,Math.min(y/z-bh/2,H-bh-8))+"px";
  const idxNow=()=>Math.round(view.scrollTop/WH_IT);
  let lastOn=-1;
  const mark=()=>{ const i=Math.max(0,Math.min(items.length-1,idxNow())); if(i===lastOn) return; if(items[lastOn]) items[lastOn].classList.remove("on"); items[i].classList.add("on");
    if(lastOn>=0&&WH&&WH.holding){ try{ if(navigator.vibrate) navigator.vibrate(5); }catch(e){} } lastOn=i; };
  // mantém a roleta “infinita”: ao parar, volta para o ciclo do meio sem mudar o que se vê
  let endT;
  const recenter=()=>{ const i=idxNow(), j=mid*len+(((i%len)+len)%len); if(i!==j){ const d=(j-i)*WH_IT; view.scrollTop+=d; if(WH) WH.st+=d; lastOn=-1; mark(); } };
  view.addEventListener("scroll",()=>{ mark(); clearTimeout(endT); endT=setTimeout(recenter,140); },{passive:true});
  view.scrollTop=(mid*len+curIdx)*WH_IT; mark();
  function finish(apply,k){
    if(!WH||WH.bg!==bg) return;
    const pick=k!=null?k:(((idxNow()%len)+len)%len);
    closeWheel(false);
    if(!apply) return;
    const v=opts[pick].v, now=VIEW.tasks[id]; if(!now||v===cur) return;
    let patch, msg;
    if(kind==="group"){ const rest=(now.tags||[]).slice(1).filter(x=>x!==v); patch={tags:v?[v,...rest]:[]}; msg=v?"Grupo: #"+v:"Sem grupo"; }
    else if(kind==="imp"){ patch={importance:v}; msg="Importância "+IMP[v].toLowerCase(); }
    else { patch={priority:v}; msg="Prioridade P"+v; }
    patchTask(id,patch); toast(msg,()=>restoreTask(id,now));
  }
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
  WH={bg,view,finish,holding:true,sy:y/z,st:view.scrollTop,moved:false};
}
function closeWheel(apply){ if(!WH) return; const w=WH; if(apply){ w.finish(true); return; } WH=null; w.bg.remove(); }
// segurando o dedo depois do toque longo: arrastar gira a roleta (sem rolar a página)
document.addEventListener("touchmove",e=>{
  if(!WH||!WH.holding) return;
  if(e.cancelable) e.preventDefault();
  const z=parseFloat(getComputedStyle(document.documentElement).zoom)||1, dy=e.touches[0].clientY/z-WH.sy;
  if(Math.abs(dy)>6) WH.moved=true;
  if(WH.moved) WH.view.scrollTop=WH.st-dy*1.3;
},{passive:false});
const wheelRelease=()=>{ if(!WH||!WH.holding) return; WH.holding=false; if(WH.moved) WH.finish(true); };
document.addEventListener("touchend",wheelRelease,{passive:true});
document.addEventListener("touchcancel",wheelRelease,{passive:true});
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&WH){ closeWheel(false); e.stopPropagation(); } },true);

/* ================= Seleção múltipla ================= */
let multiLast=null;
function setMulti(on){ UI.multiOn=on; UI.multi=new Set(); multiLast=null; if(on) UI.sel=null; render(); }
function toggleMulti(id,range){
  if(!UI.multiOn){ UI.multiOn=true; UI.sel=null; }
  if(range&&multiLast){
    const ids=[...new Set([...document.querySelectorAll("#wrap .task[data-id]")].map(r=>r.dataset.id))], a=ids.indexOf(multiLast), b=ids.indexOf(id);
    if(a>=0&&b>=0){ ids.slice(Math.min(a,b),Math.max(a,b)+1).forEach(x=>UI.multi.add(x)); multiLast=id; render(); return; }
  }
  if(UI.multi.has(id)) UI.multi.delete(id); else UI.multi.add(id);
  multiLast=id; render();
}
/* aplica uma alteração a todas as selecionadas, com um único “Desfazer” */
function bulkRun(fn,msg,exit){
  const now=new Date().toISOString(), prev={}, ops=[];
  for(const id of UI.multi){
    const t=VIEW.tasks[id]; if(!t) continue;
    const p=fn({...t,id}); if(p==null) continue;
    prev[id]=t;
    ops.push(p==="delete"?{op:"delete",path:"tasks/"+id}:{op:"set",path:"tasks/"+id,data:{...t,...p,updatedAt:now}});
  }
  if(!ops.length){ toast("Nada a alterar nas tarefas selecionadas."); return; }
  if(exit){ UI.multiOn=false; UI.multi=new Set(); }
  if(UI.sel&&prev[UI.sel]&&ops.some(o=>o.op==="delete"&&o.path==="tasks/"+UI.sel)) UI.sel=null;
  enqueueMany(ops);
  toast(msg(ops.length),()=>enqueueMany(Object.entries(prev).map(([id,d])=>({op:"set",path:"tasks/"+id,data:{...d,updatedAt:new Date().toISOString()}}))));
}
const nTxt=(n,s,p)=>`${n} ${n===1?s:p}`;
function bulkDue(due,label){ bulkRun(t=>t.due===due?null:(due?{due}:(t.repeat?{due:null,repeat:null}:{due:null})),n=>nTxt(n,"tarefa","tarefas")+" · "+label); }
function bulkPickDate(){
  const inp=h("input",{type:"date",id:"bulkDate",style:"border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)"});
  openModal("Prazo para "+nTxt(UI.multi.size,"tarefa","tarefas"),h("div",{class:"field"},h("label",{for:"bulkDate"},"Data"),inp),[
    {label:"Aplicar",cls:"primary",run:()=>{ if(!inp.value){ toast("Escolha uma data."); return false; } bulkDue(inp.value,"prazo "+fmtShort(inp.value)); }}]);
  setTimeout(()=>inp.focus(),30);
}
function bulkGroup(){
  const names=allTags().names;
  if(!names.length){ toast("Nenhum grupo criado ainda."); return; }
  openModal("Adicionar "+nTxt(UI.multi.size,"tarefa","tarefas")+" a um grupo",h("div",{class:"opts"},names.map(n=>h("button",{class:"opt",onclick:()=>{ $("#modalRoot").replaceChildren();
    bulkRun(t=>(t.tags||[]).includes(n)?null:{tags:[...(t.tags||[]),n]},c=>nTxt(c,"tarefa","tarefas")+" em #"+n); }},h("span",{class:"tag-swatch",style:`background:${tagColor(n)}`}),"#"+n))),[]);
}
function renderBulk(){
  for(const id of [...UI.multi]) if(!VIEW.tasks[id]) UI.multi.delete(id);
  document.body.classList.toggle("has-bulk",UI.multiOn);
  let bar=$("#bulk");
  if(!UI.multiOn){ if(bar) bar.remove(); return; }
  if(!bar){ bar=h("div",{class:"bulk",id:"bulk",role:"toolbar","aria-label":"Ações para as tarefas selecionadas"}); document.body.append(bar); }
  const n=UI.multi.size, td=today();
  const B=(label,icon,fn,cls,always)=>h("button",{class:cls||null,disabled:!n&&!always,onclick:e=>fn(e)},svg(icon,16),label);
  const visible=()=>[...new Set([...document.querySelectorAll("#wrap .task[data-id]")].map(r=>r.dataset.id))];
  // “Tirar do dia”: num dia futuro da home tira o prazo daquele dia; nos demais casos tira do Meu Dia
  const dayKey=UI.view==="home"&&!UI.q&&UI.homeDay&&UI.homeDay!==td?UI.homeDay:null;
  bar.replaceChildren(
    h("span",{class:"bulk-n"},n?nTxt(n,"selecionada","selecionadas"):"Toque nas tarefas"),
    B("Todas",ICON.list,()=>{ const ids=visible(); UI.multi=ids.every(x=>UI.multi.has(x))?new Set():new Set(ids); render(); },null,true),
    h("span",{class:"bulk-sep"}),
    B("Concluir",ICON.check,()=>bulkRun(t=>t.done?null:isRec(t)?recDonePatch(t,t.due):{done:true,doneAt:new Date().toISOString()},c=>nTxt(c,"tarefa concluída","tarefas concluídas"))),
    B("Meu Dia",ICON.sun,()=>bulkRun(t=>t.done||inMyDay(t)?null:{myDay:td},c=>nTxt(c,"tarefa adicionada","tarefas adicionadas")+" ao Meu Dia")),
    B("Tirar do dia",ICON.calx,()=>bulkRun(t=>{
        if(dayKey){ if(!dueOn(t,dayKey)) return null; return isRec(t)?recSkipPatch(t,dayKey):{due:null}; }
        return inMyDay(t)?{myDay:"no:"+td}:null; },c=>nTxt(c,"tarefa retirada","tarefas retiradas")+" do dia")),
    B("Prazo",ICON.cal,e=>openCtx(e.clientX,e.clientY,[
      {label:"Hoje",icon:ICON.cal,run:()=>bulkDue(td,"prazo hoje")},
      {label:"Amanhã",icon:ICON.cal,run:()=>bulkDue(ymd(addDays(new Date(),1)),"prazo amanhã")},
      {label:"Em 1 semana",icon:ICON.cal,run:()=>bulkDue(ymd(addDays(new Date(),7)),"prazo em 1 semana")},
      {label:"Escolher data…",icon:ICON.edit,run:bulkPickDate},
      {label:"Sem prazo",icon:ICON.calx,run:()=>bulkDue(null,"prazo removido")}])),
    B("Mais",ICON.flag,e=>openCtx(e.clientX,e.clientY,[
      ...[1,2,3].map(p=>({label:PRI[p],icon:ICON.flag,run:()=>bulkRun(t=>(t.priority||2)===p?null:{priority:p},c=>nTxt(c,"tarefa","tarefas")+" · P"+p)})),
      ...[3,2,1].map(v=>({label:"Importância "+IMP[v].toLowerCase(),icon:ICON.star,run:()=>bulkRun(t=>(t.importance||2)===v?null:{importance:v},c=>nTxt(c,"tarefa","tarefas")+" · importância "+IMP[v].toLowerCase())})),
      {label:"Adicionar a um grupo…",icon:ICON.tag,run:bulkGroup}])),
    B("Apagar",ICON.trash,()=>bulkRun(()=>"delete",c=>nTxt(c,"tarefa apagada","tarefas apagadas"),true),"b-del"),
    h("span",{class:"bulk-sep"}),
    h("button",{"aria-label":"Sair da seleção",title:"Sair da seleção (Esc)",onclick:()=>setMulti(false)},svg(ICON.x,16)));
}

/* ---------- Detalhe ---------- */
function select(id){ UI.sel=id; UI.detailHidden=false; render(); }
/* atalho: abre/fecha o painel Detalhes da tarefa (a tarefa continua selecionada ao fechar) */
function toggleDetail(){
  if(UI.sel&&VIEW.tasks[UI.sel]&&!UI.detailHidden){
    const id=UI.sel; UI.detailHidden=true; render();
    setTimeout(()=>{ const r=document.querySelector(`#wrap .task[data-id="${id}"]`); if(r) r.focus(); },0);
    return;
  }
  const id=keyTask(); if(!id){ toast("Selecione uma tarefa primeiro."); return; }
  UI.sel=id; UI.detailHidden=false; render();
}
function renderDetail(){
  const pane=$("#detail"), app=$("#app");
  const t=UI.sel&&!UI.detailHidden&&VIEW.tasks[UI.sel];
  if(!t){ pane.hidden=true; app.classList.remove("has-detail"); return; }
  const id=UI.sel;
  // não reconstruir enquanto o usuário edita um campo do painel
  if(!UI.forceDetail && !pane.hidden && pane.dataset.id===id && pane.contains(document.activeElement) && document.activeElement.matches("textarea,input[type=text]")) return;
  pane.hidden=false; app.classList.add("has-detail"); pane.dataset.id=id; pane.replaceChildren();
  const title=h("textarea",{id:"dTitle",rows:"1","aria-label":"Nome da tarefa"}); title.value=t.title;
  const fit=()=>{title.style.height="auto";title.style.height=title.scrollHeight+"px";};
  title.addEventListener("input",fit); setTimeout(fit,0);
  title.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();title.blur();}});
  title.addEventListener("blur",()=>{const v=title.value.replace(/\s+/g," ").trim(); if(v&&v!==VIEW.tasks[id]?.title) patchTask(id,{title:v}); else title.value=VIEW.tasks[id]?.title||"";});
  const opt=(cur,val,label,onPick)=>h("button",{class:"opt"+(cur===val?" on":""),onclick:()=>onPick(val)},label);
  // tags
  const refocus=UI.forceDetail; UI.forceDetail=false;
  // ----- etapas (como no Microsoft To Do)
  const steps=(t.steps||[]).map(x=>({...x}));
  const saveSteps=(list,keepFocus)=>{ UI.forceDetail=!!keepFocus; patchTask(id,{steps:list}); };
  const stepBox=h("div",{class:"steps"});
  steps.forEach((st,i)=>{
    const inp=h("textarea",{rows:"1",class:"step-in","aria-label":"Etapa "+(i+1)}); inp.value=st.title;
    const fitS=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";}; inp.addEventListener("input",fitS); setTimeout(fitS,0);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();inp.blur();} if(e.key==="Escape"){inp.value=st.title;inp.blur();} });
    inp.addEventListener("blur",()=>{ const v=inp.value.trim(); if(v===st.title) return; const L=steps.map(x=>({...x})); if(v) L[i].title=v; else L.splice(i,1); saveSteps(L); });
    const move=d=>{ const j=i+d; if(j<0||j>=steps.length) return; const L=steps.map(x=>({...x})); [L[i],L[j]]=[L[j],L[i]]; saveSteps(L); };
    stepBox.append(h("div",{class:"step"+(st.done?" done":"")},
      h("button",{class:"check","aria-label":st.done?"Marcar etapa como pendente":"Concluir etapa",onclick:()=>{ const L=steps.map(x=>({...x})); L[i].done=!L[i].done; saveSteps(L); }},h("span",{},st.done?svg(ICON.check,11,'stroke-width="3.4"'):null)),
      inp,
      i>0?h("button",{class:"act",title:"Subir","aria-label":"Subir etapa",onclick:()=>move(-1)},svg('<path d="M12 19V5M6 11l6-6 6 6"/>',15)):null,
      h("button",{class:"act act-del",title:"Excluir etapa","aria-label":"Excluir etapa",onclick:()=>{ const L=steps.map(x=>({...x})); L.splice(i,1); saveSteps(L); }},svg(ICON.x,15))));
  });
  const addStep=h("input",{type:"text",id:"dStepAdd",placeholder:"Adicionar etapa","aria-label":"Adicionar etapa"});
  addStep.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=addStep.value.trim(); if(!v) return;
    saveSteps([...steps,{id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:v,done:false}],true); } });
  stepBox.append(h("label",{class:"step-add",for:"dStepAdd"},svg(ICON.plus,17),addStep));
  if(refocus) setTimeout(()=>{ const a=$("#dStepAdd"); if(a) a.focus(); },0);
  const nDone=steps.filter(x=>x.done).length;
  const tagBox=h("div",{class:"tagedit"});
  (t.tags||[]).forEach(g=>tagBox.append(h("span",{class:"chip"},h("i",{style:`background:${tagColor(g)}`}),"#"+g,

/* data usada no relatório: dia (no fuso local) em que foi concluída; sem esse registro, o prazo */
function repDate(t){
  if(t.doneAt){ const d=new Date(t.doneAt); return isNaN(d)?String(t.doneAt).slice(0,10):ymd(d); }
  return t.due||null;
}
const repCell=t=>{ const d=repDate(t); return d?fmtBR(d)+(t.doneAt?"":" (prazo)"):"sem data"; };
function reportRows(){
  const R=UI.rep;
  return tasksArr().filter(t=>t.done).filter(t=>{ const d=repDate(t); return d?((!R.from||d>=R.from)&&(!R.to||d<=R.to)):R.undated!==false; })
    .filter(t=>!R.tags.length||(t.tags||[]).some(g=>R.tags.includes(g)))
    .sort((a,b)=>{ const x=repDate(a)||"9999", y=repDate(b)||"9999"; return x<y?-1:x>y?1:(a.doneAt||"").localeCompare(b.doneAt||"")||a.title.localeCompare(b.title,"pt-BR"); });
}
function reportCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[["Concluída em","Tarefa","Grupos","Importância","Prioridade","Prazo","No prazo","Anotações"].map(q).join(";")];
  for(const t of reportRows()) lines.push([repCell(t),t.title,(t.tags||[]).map(g=>"#"+g).join(" "),IMP[t.importance||2],"P"+(t.priority||2),t.due?fmtBR(t.due):"",t.due&&t.doneAt?(repDate(t)<=t.due?"sim":"não"):"",t.notes||""].map(q).join(";"));

}

function downloadFile(name,data,type){
  try{
    const blob=new Blob([data],{type});
    const url=URL.createObjectURL(blob);
    const a=h("a",{href:url,download:name}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); return true;
  }catch(e){ return false; }
}
/* celular / app instalado: o download direto de arquivo gerado no app costuma não acontecer;
   usa a folha de compartilhamento do sistema (Salvar em Arquivos, Drive, e-mail…). No computador, baixa o arquivo. */
async function shareOrDownload(name,data,type){
  const touch=window.matchMedia&&matchMedia("(hover:none)").matches;
  if(touch&&navigator.canShare&&navigator.share&&typeof File==="function"){
    try{ const f=new File([data],name,{type:type.split(";")[0]}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return "shared"; } }
    catch(e){ if(e&&e.name==="AbortError") return "cancel"; }
  }
  return downloadFile(name,data,type)?"ok":"fail";
}
async function exportFile(kind){
  const R=UI.rep; const name=`relatorio-tarefas_${R.from}_a_${R.to}.${kind}`;
  const r=kind==="csv"?await shareOrDownload(name,reportCSV(),"text/csv;charset=utf-8"):await shareOrDownload(name,reportHTML(),"text/html;charset=utf-8");
  if(r==="shared"||r==="cancel") return;
  if(r==="ok") toast("Relatório exportado"); else { copyText(reportPlain()); toast("Não foi possível baixar. O relatório foi copiado."); }
}

  const w=window.open("","_blank");
  if(w){ w.document.open(); w.document.write(html); w.document.close(); toast("Escolha “Salvar como PDF” na janela de impressão."); return; }
  // janela bloqueada: imprime por um quadro oculto
  const fr=h("iframe",{style:"position:fixed;right:0;bottom:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none","aria-hidden":"true"});

/* tarefas que entram no cronograma: marcadas com crono:true (coluna da direita do projeto) */

/* datas exibidas no cronograma: o que foi editado no cronograma + as tarefas do cronograma (título e prazo sempre atuais) */
function cronoEvents(p){
  const ev=p.eventos.map(e=>({...e,atividades:[...e.atividades]}));
  for(const t of (p.tag?cronoTasks(p.tag):[])){
    const [y,m,d]=t.due.split("-").map(Number);
    let e=ev.find(x=>x.y===y&&x.m===m&&x.d===d);
    if(!e){ e={y,m,d,horario:"",contexto:"",atividades:[],rotulo:"",sem:false}; ev.push(e); }

/* projetos antigos: atividades copiadas das tarefas viram tarefas do cronograma (ligadas à tarefa), uma única vez */
const MIG_DONE=new Set();
function migrateProject(tag){

function createProject(tag){

/* ---- desenho (mesmas regras da ferramenta) ---- */
function crPeriodo(ev){

  if(a.y!==b.y) return "Cronograma de "+A+" de "+a.y+" a "+B+" de "+b.y;
  if(a.m===b.m) return "Cronograma de "+a.d+" a "+B+" de "+a.y;

}

/* evita rótulos sobrepostos na faixa: primeiro some a legenda, depois a própria data (autocontida: também roda na página de impressão) */
function crAjustar(root){
  root.querySelectorAll(".escala").forEach(function(esc){
    var marcas=Array.prototype.slice.call(esc.querySelectorAll(".marca")), limite=esc.getBoundingClientRect();
    if(!limite.width) return;
    ["acima","abaixo"].forEach(function(lado){
      var ultimo=-Infinity;
      marcas.filter(function(m){return m.classList.contains(lado);}).forEach(function(m){
        var r=m.querySelector(".rotulo"); r.classList.remove("sem-legenda","oculto"); r.style.transform=""; r.style.left=""; r.style.textAlign="";
        var box=r.getBoundingClientRect();
        if(!m.classList.contains("ini")&&!m.classList.contains("fim")){
          if(box.left<limite.left-12){ r.style.transform="none"; r.style.left="-12px"; r.style.textAlign="left"; box=r.getBoundingClientRect(); }
          else if(box.right>limite.right+12){ r.style.transform="translateX(-100%)"; r.style.left="12px"; r.style.textAlign="right"; box=r.getBoundingClientRect(); }
        }
        if(box.left<ultimo+8){ r.classList.add("sem-legenda"); box=r.getBoundingClientRect(); }
        if(box.left<ultimo+8){ r.classList.add("oculto"); return; }
        ultimo=box.right;
      });
    });
  });
}
function crAjustarTudo(){ requestAnimationFrame(()=>crAjustar(document)); }

const FIRED_KEY="agenda-fired-v1", PUSH_KEY="agenda-push-v1", CATCHUP=12*3600e3;

    [0,.25,.5].forEach((dt,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=i===2?1175:880;

const pushSupported=()=>location.protocol.startsWith("http")&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const fnURL=()=>CFG.url.trim().replace(/\/+$/,"")+"/functions/v1/lembretes";

  const r=await fetch(fnURL(),{...opts,headers}); let j={}; try{ j=await r.json(); }catch(e){}

  let pk; try{ pk=(await fnCall({method:"GET"})).publicKey; }catch(e){ throw new Error("noserver"); }

  const {error}=await S.sb.from("push_subs").upsert({user_id:S.user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,device:navigator.userAgent.slice(0,180)},{onConflict:"endpoint"});

  {id:"impA",grp:"task",label:"Importância alta",def:"Shift+1",run:taskKey(()=>({importance:3}),()=>"Importância alta")},
  {id:"impM",grp:"task",label:"Importância média",def:"Shift+2",run:taskKey(()=>({importance:2}),()=>"Importância média")},
  {id:"impB",grp:"task",label:"Importância baixa",def:"Shift+3",run:taskKey(()=>({importance:1}),()=>"Importância baixa")},
  {id:"dueToday",grp:"task",label:"Prazo: hoje",def:"Shift+H",run:taskKey(()=>({due:today()}),()=>"Prazo: hoje")},
  {id:"dueTom",grp:"task",label:"Prazo: amanhã",def:"Shift+A",run:taskKey(()=>({due:ymd(addDays(new Date(),1))}),()=>"Prazo: amanhã")},
  {id:"dueWeek",grp:"task",label:"Prazo: em 1 semana",def:"Shift+S",run:taskKey(()=>({due:ymd(addDays(new Date(),7))}),()=>"Prazo: em 1 semana")},
  {id:"dueNone",grp:"task",label:"Sem prazo",def:"Shift+X",run:taskKey(()=>({due:null}),()=>"Prazo removido")},
  {id:"detail",grp:"task",label:"Abrir / fechar Detalhes da tarefa",def:"E",run:toggleDetail},
  {id:"myday",grp:"task",label:"Adicionar / tirar do Meu Dia",def:"M",run:()=>{ const id=keyTask(); if(!id){ toast("Abra ou selecione uma tarefa primeiro."); return; } toggleMyDay({...VIEW.tasks[id],id}); }}
];
const defaultKeys=()=>Object.fromEntries(KEY_ACTIONS.map(a=>[a.id,a.def]));
const KEYS_SAVED=lsGet(KEYS_KEY,{});
let KEYS=Object.assign(defaultKeys(),KEYS_SAVED);
// atalho novo cuja tecla sugerida já foi escolhida pelo usuário para outra ação: fica sem atalho (sem conflito)
for(const a of KEY_ACTIONS) if(!(a.id in KEYS_SAVED)&&Object.keys(KEYS_SAVED).length&&KEY_ACTIONS.some(x=>x.id!==a.id&&x.id in KEYS_SAVED&&KEYS_SAVED[x.id]===a.def)) KEYS[a.id]="";
for(const k of Object.keys(KEYS)) if(typeof KEYS[k]!=="string") KEYS[k]="";
const saveKeys=()=>lsSet(KEYS_KEY,KEYS);
let KEY_REC=false;
function comboOf(e){
  if(["Shift","Control","Alt","Meta","AltGraph","CapsLock","Tab"].includes(e.key)) return null;
  let k=/^Key[A-Z]$/.test(e.code)?e.code.slice(3):/^Digit\d$/.test(e.code)?e.code.slice(5):/^Numpad\d$/.test(e.code)?e.code.slice(6):(e.key.length===1?e.key.toUpperCase():e.key);
  if(!k||k==="Unidentified"||k==="Dead") return null;
  if(k===" ") k="Espaço";
  return (e.ctrlKey?"Ctrl+":"")+(e.altKey?"Alt+":"")+(e.shiftKey?"Shift+":"")+(e.metaKey?"Meta+":"")+k;
}
const fmtCombo=c=>c?c.split("+").join(" + "):"—";
document.addEventListener("keydown",e=>{
  if(KEY_REC||e.defaultPrevented||e.isComposing||e.repeat) return;
  const tg=e.target;
  if(tg&&tg.closest&&tg.closest("input,textarea,select,[contenteditable]")) return;   // digitando: atalhos desligados
  if($("#modalRoot").firstChild||$("#ctx")) return;
  const c=comboOf(e); if(!c) return;
  if(tg&&tg.closest&&tg.closest(".task")&&(c==="Enter"||c==="Delete")) return;          // Enter/Delete da linha continuam como antes
  const a=KEY_ACTIONS.find(x=>KEYS[x.id]===c); if(!a) return;
  e.preventDefault(); a.run();
});
function recordKey(a,btn){
  if(KEY_REC) return;
  KEY_REC=true; btn.classList.add("rec"); btn.textContent="Pressione…";
  let finished=false;
  const done=()=>{ if(finished) return; finished=true; window.removeEventListener("keydown",onKey,true); btn.removeEventListener("blur",done); KEY_REC=false; refreshConfig(); };
  const onKey=e=>{
    e.preventDefault(); e.stopPropagation();
    if(e.key==="Escape"){ done(); return; }
    let c;
    if(e.key==="Backspace"||e.key==="Delete") c="";
    else{
      c=comboOf(e); if(!c) return;
      if(c==="/"||c==="Enter"){ toast(c==="/"?"A tecla / já abre a pesquisa.":"Enter não pode ser usado."); return; }
      const other=KEY_ACTIONS.find(x=>x.id!==a.id&&KEYS[x.id]===c);
      if(other){ KEYS[other.id]=""; toast(`${fmtCombo(c)} foi tirado de “${other.label}”.`); }
    }
    KEYS[a.id]=c; saveKeys(); done();
  };
  window.addEventListener("keydown",onKey,true);
  btn.addEventListener("blur",done);
}
function keysSection(){
  const sec=h("div",{class:"settings-sec",id:"setKeys"},h("h4",{},"Atalhos de teclado"),
    h("p",{},"Já vêm com sugestões. Para trocar, clique na tecla e pressione a nova combinação (Esc cancela, Backspace deixa sem atalho). Os atalhos não funcionam enquanto você digita num campo. Os de classificação e prazo valem para a tarefa aberta nos detalhes ou selecionada na lista."));
  const list=h("div",{class:"keys"});
  for(const [g,label] of [["nav","Navegação"],["task","Tarefa: classificação e prazo"]]){
    list.append(h("div",{class:"keys-sub"},label));
    for(const a of KEY_ACTIONS.filter(x=>x.grp===g)){
      const b=h("button",{class:"btn small kbd"+(KEYS[a.id]?"":" none"),"aria-label":`Atalho de ${a.label}: ${KEYS[a.id]?fmtCombo(KEYS[a.id]):"nenhum"}. Clique para trocar.`},fmtCombo(KEYS[a.id]));
      b.addEventListener("click",()=>recordKey(a,b));
      list.append(h("div",{class:"key-row"},h("span",{},a.label),b));
    }
  }
  sec.append(list,h("div",{class:"row-end",style:"justify-content:flex-start"},
    h("button",{class:"btn small",onclick:()=>{ KEYS=defaultKeys(); saveKeys(); refreshConfig(); toast("Atalhos sugeridos restaurados"); }},"Restaurar sugestões")));
  return sec;
}
function refreshConfig(){ const b=$("#cfgBody"); if(b) b.replaceWith(configBody()); }
function openConfig(){ openModal("Configurações",configBody(),[]); }
function configBody(){
  const box=h("div",{id:"cfgBody",style:"display:flex;flex-direction:column;gap:14px"});
  box.append(h("div",{class:"settings-sec",style:"border-top:0;padding-top:0"},h("h4",{},"Sincronização e dados"),
    h("p",{},"Conta e sincronização entre computador e celular, lembretes, backup e instalação do app; importar tarefas de outra lista."),
    h("div",{class:"row-end",style:"justify-content:flex-start"},
      h("button",{class:"btn",onclick:()=>openSettings()},"Sincronização e backup"),
      h("button",{class:"btn",onclick:()=>openImport()},"Importar lista de tarefas"))));
  box.append(h("div",{class:"settings-sec"},h("h4",{},"Tamanho do texto no computador"),
    h("p",{},"Vale para telas de computador; no celular o tamanho não muda. Padrão: 90%."),
    h("div",{},h("span",{class:"seg"},[[0.8,"80%"],[0.9,"90%"],[1,"100%"],[1.1,"110%"]].map(([z,l])=>h("button",{class:PREFS.zoom===z?"on":"",onclick:()=>{ PREFS.zoom=z; lsSet(PREF_KEY,PREFS); applyZoom(); refreshConfig(); }},l))))));
  const fsKey=KEYS.full?` Atalho: ${fmtCombo(KEYS.full)}.`:"";
  box.append(h("div",{class:"settings-sec"},h("h4",{},"Tela cheia"),
    h("p",{},"Esconde as barras do navegador e do sistema. Para sair, use Esc ou o mesmo botão."+fsKey),
    h("div",{},h("button",{class:"btn",onclick:toggleFullscreen},fsEl()?"Sair da tela cheia":"Entrar em tela cheia"))));
  box.append(keysSection());
  return box;
}
